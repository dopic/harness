# Baseline Azure Pipelines skeleton — secdevops adapts per repo (commands come from
# harness.yaml → commands / test-suites). Stages marked [suite:<name>] are the
# materialization of the test-suites contract; `harness doctor` greps for these markers.

trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

stages:
  - stage: ci
    displayName: "CI (every PR)"
    jobs:
      - job: verify
        steps:
          - script: echo "install deps"        # replace per repo
          - script: echo "{{commands.lint}}"
          - script: echo "{{commands.test_fast}}"
          - script: echo "SAST + dependency scan + secret scan"

  - stage: ci_post_merge          # [suite:integration]
    displayName: "Post-merge: integration"
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: integration
        steps:
          - script: echo "{{test-suites.integration.command}}"

  - stage: test_env               # [suite:acceptance]
    displayName: "Test env: acceptance (Cypress)"
    dependsOn: ci_post_merge
    jobs:
      - deployment: acceptance
        environment: test
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "{{test-suites.acceptance.command}}"

  - stage: deploy                 # [suite:smoke]
    displayName: "Deploy + smoke"
    dependsOn: test_env
    jobs:
      - deployment: production
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "deploy"
                - script: echo "{{test-suites.smoke.command}}"
