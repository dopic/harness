[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-cli"
# Read from harness_cli.__version__, which is held in lockstep with core/VERSION.
dynamic = ["version"]
description = "Installer/compiler for the agent-based development harness"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
harness = "harness_cli:main"

[tool.setuptools]
py-modules = ["harness_cli"]

[tool.setuptools.dynamic]
version = {attr = "harness_cli.__version__"}
