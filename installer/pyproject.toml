[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-cli"
version = "0.1.0"
description = "Installer/compiler for the agent-based development harness"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
harness = "harness_cli:main"

[tool.setuptools]
py-modules = ["harness_cli"]
